stages: [validate, package, deploy]

shell-and-yaml:
  stage: validate
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache shellcheck
    - pip install --no-cache-dir PyYAML==6.0.3
  script:
    - shellcheck scripts/*.sh
    - python -c 'import yaml; [yaml.safe_load(open(p)) for p in ("compose.yaml", ".gitlab-ci.yml")]'
    - python scripts/validate-topology.py

compose-config:
  stage: validate
  image: docker:27
  script:
    - export POSTGRES_IMAGE=postgres:18.6-trixie PUBLIC_API_IMAGE=example/public@sha256:0000 ADMIN_API_IMAGE=example/admin@sha256:0000 STUDIO_API_IMAGE=example/studio-api@sha256:0000 STUDIO_WEB_IMAGE=example/studio-web@sha256:0000 CADDY_IMAGE=caddy:2
    - export POSTGRES_VOLUME_NAME=reviewed-volume NEXUS_SECRET_DIR=/private/secrets API_DOMAIN=api.example.invalid STUDIO_DOMAIN=studio.example.invalid ACME_EMAIL=ops@example.invalid BACKUP_DIR=/private/backup
    - docker compose config --quiet

caddy-validate:
  stage: validate
  image:
    name: caddy:2
    entrypoint: [""]
  variables:
    API_DOMAIN: api.example.invalid
    STUDIO_DOMAIN: studio.example.invalid
    ACME_EMAIL: ops@example.invalid
  script:
    - caddy validate --config Caddyfile --adapter caddyfile

package-review:
  stage: package
  image: alpine:3.20
  script:
    - echo "Images are built, tested and pushed by their owning application repositories."
    - echo "Record exact registry digests in a reviewed release manifest before production."

production-deploy:
  stage: deploy
  image: alpine:3.20
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  allow_failure: false
  script:
    - echo "Deployment is a human runbook action; this job intentionally has no SSH key or deployment command."
    - echo "Review docs/deployment.md and approve the protected environment separately."
